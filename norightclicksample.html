<!DOCTYPE html>
<html>
<head>
  <title>Disable Right Click</title>
  <script>
    document.addEventListener("contextmenu", function(event) {
      event.preventDefault();
    });
  </script>
</head>
<body>
  <h1>Right-click Disabled</h1>
  <p>You can’t open the context menu here.</p>
</body>
</html>
